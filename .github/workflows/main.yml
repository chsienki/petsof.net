name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Generate site (dry run)
        run: dotnet run --project "$GITHUB_WORKSPACE/src/SiteBuilder.csproj" "$GITHUB_WORKSPACE" "${{ secrets.IMG_CONNECTION }}" true

      - name: Generate site
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: dotnet run --project "$GITHUB_WORKSPACE/src/SiteBuilder.csproj" "$GITHUB_WORKSPACE" "${{ secrets.IMG_CONNECTION }}"

      - name: Prepare site
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir publish
          cp index.html template.html pets.json publish/
          cp -R css img publish/

      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy publish --project-name=petsof-net --commit-dirty=true
